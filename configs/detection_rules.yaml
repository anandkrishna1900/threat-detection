# Detection Rules Configuration
# Hybrid Cybersecurity Threat Detection Platform

rules:
  - id: RULE_AUTH_001
    name: Excessive Failed Logins
    description: Detects multiple failed authentication attempts from a single source within a short window (brute force pattern).
    severity: HIGH
    enabled: true
    mitre_tactic: Credential Access
    mitre_technique: T1110.001
    conditions:
      auth_failed_count: 5
      window_seconds: 60
    confidence: 0.85

  - id: RULE_AUTH_002
    name: Password Spraying Across Multiple Accounts
    description: Detects authentication attempts targeting multiple distinct usernames from a single source within 5 minutes.
    severity: HIGH
    enabled: true
    mitre_tactic: Credential Access
    mitre_technique: T1110.003
    conditions:
      unique_users_targeted: 3
      auth_failed_count: 3
      window_seconds: 300
    confidence: 0.90

  - id: RULE_AUTH_003
    name: Successful Login After Multiple Failures
    description: Detects a successful authentication event following a burst of failed attempts from the same source.
    severity: CRITICAL
    enabled: true
    mitre_tactic: Credential Access
    mitre_technique: T1110
    conditions:
      is_success: true
      prior_failures_threshold: 3
      window_seconds: 300
    confidence: 0.95

  - id: RULE_NET_001
    name: Port Scan Activity
    description: Detects single source connecting to an unusually high number of unique destination ports within 5 minutes.
    severity: MEDIUM
    enabled: true
    mitre_tactic: Discovery
    mitre_technique: T1046
    conditions:
      unique_dst_ports: 10
      window_seconds: 300
    confidence: 0.80

  - id: RULE_NET_002
    name: Excessive Connection Attempts
    description: Detects a burst of network connection attempts exceeding normal thresholds.
    severity: MEDIUM
    enabled: true
    mitre_tactic: Impact
    mitre_technique: T1498
    conditions:
      conns_1m: 50
    confidence: 0.75

  - id: RULE_NET_003
    name: Abnormal Outbound Data Volume
    description: Detects large outbound data transmission exceeding the volume threshold (data exfiltration indicator).
    severity: HIGH
    enabled: true
    mitre_tactic: Exfiltration
    mitre_technique: T1048
    conditions:
      bytes_sent_threshold: 10000000.0  # 10 MB
    confidence: 0.85

  - id: RULE_HOST_001
    name: Unusual Administrative Activity
    description: Detects administrative actions or privileged account usage during off-hours.
    severity: MEDIUM
    enabled: true
    mitre_tactic: Privilege Escalation
    mitre_technique: T1078
    conditions:
      is_off_hours: true
      admin_usernames:
        - root
        - administrator
        - admin
        - system
    confidence: 0.70

  - id: RULE_EVENT_001
    name: Suspicious Event Burst
    description: Detects an abnormal volume of events generated by a single entity within 1 minute.
    severity: LOW
    enabled: true
    mitre_tactic: Discovery
    mitre_technique: T1498
    conditions:
      events_1m: 100
    confidence: 0.65

  - id: RULE_AUTH_004
    name: Multi-Host Authentication Failures
    description: Detects failed authentication events from a single source targeting multiple distinct destination IPs.
    severity: HIGH
    enabled: true
    mitre_tactic: Lateral Movement
    mitre_technique: T1021
    conditions:
      unique_dst_ips: 3
      auth_failed_count: 3
      window_seconds: 300
    confidence: 0.85

  - id: RULE_NET_004
    name: Sensitive Service Access
    description: Detects network traffic targeting high-risk management and database ports.
    severity: MEDIUM
    enabled: true
    mitre_tactic: Initial Access
    mitre_technique: T1190
    conditions:
      sensitive_ports:
        - 22    # SSH
        - 23    # Telnet
        - 3389  # RDP
        - 445   # SMB
        - 1433  # MSSQL
        - 3306  # MySQL
        - 5432  # PostgreSQL
        - 27017 # MongoDB
    confidence: 0.70
