# Model configuration
version: "1.0"

isolation_forest:
  n_estimators: 200
  max_samples: "auto"
  contamination: 0.05
  max_features: 1.0
  bootstrap: false
  random_state: 42
  n_jobs: -1
  threshold_strategy: "contamination"
  manual_threshold: null
  scaler: "standard"
  handle_missing: "median"

one_class_svm:
  enabled: false
  kernel: "rbf"
  nu: 0.05
  gamma: "scale"

feature_sets:
  network:
    enabled: true
    features: []
  authentication:
    enabled: true
    features: []
  host:
    enabled: true
    features: []
  temporal:
    enabled: true
    features: []

artifact:
  version: "v1"
  save_dir: "./models"

