# Risk scoring configuration
version: "1.0"

hybrid_weights:
  rule_score: 0.45
  behavior_score: 0.30
  ml_score: 0.25

correlation_bonus:
  enabled: false
  max_bonus: 20
  per_correlated_event: 2

severity_thresholds:
  LOW:      { min: 0,  max: 24 }
  MEDIUM:   { min: 25, max: 49 }
  HIGH:     { min: 50, max: 74 }
  CRITICAL: { min: 75, max: 100 }

incident_risk_weights:
  rule: 0.36
  behavior: 0.24
  ml: 0.20
  correlation: 0.12
  impact: 0.08

normalise_components: true
clamp_min: 0
clamp_max: 100

confidence_bands:
  LOW:    { min: 0.0,  max: 0.39 }
  MEDIUM: { min: 0.40, max: 0.69 }
  HIGH:   { min: 0.70, max: 0.89 }
  VERY_HIGH: { min: 0.90, max: 1.0 }

min_evidence_for_critical: 3

